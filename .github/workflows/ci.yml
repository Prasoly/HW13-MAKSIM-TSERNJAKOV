name: Build and Test

on:
  push:
    branches:
      - main
      - feat/ak/TL-13
      - feat/ak/TL-13)
  pull_request:
    branches:
      - main
      - feat/ak/TL-13)
      - feat/ak/TL-13

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
         compose-file: ./docker-compose.yaml
         up-flags: -d
      - name: Run tests for empty users
        run: npx playwright test tests/DTO/no_users_controllers_spec.ts
      - name: Run tests with correct users
        run: npx playwright test tests/DTO/user-controller.test.ts
      - name: Run tests
        run: npx playwright test

      - name: Run empty user controller tests
        run: npx playwright test tests/no_users_controllers.spec.ts

      - name: Run user controller tests
        run: npx playwright test tests/user_controller.spec.ts